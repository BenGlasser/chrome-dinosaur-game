<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport", content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#ffffff">
        <title>Chrome Dinosaur Game</title>
        <link rel="manifest" href="./manifest.webmanifest">
        <link rel="icon" href="./img/dino.png" type="image/png">
        <link rel="stylesheet" href="dino.css">
        <script>
            //register the service worker so Chrome can install this as a PWA
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", function() {
                    navigator.serviceWorker.register("./sw.js");
                });
            }
        </script>
        <script src="dino.js"></script>
    </head>
    <body>
        <h1>Chrome Dinosaur Game</h1>
        <canvas id="board"></canvas>
        <div id="tuning">
            <label>speed
                <input type="range" id="speedSlider" min="1" max="12" step="0.5" value="4">
                <span id="speedValue">4</span>
            </label>
            <label>ramp
                <input type="range" id="rampSlider" min="0" max="10" step="0.1" value="0">
                <span id="rampValue">0</span>
            </label>
        </div>
    </body>
</html>
